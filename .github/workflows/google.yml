name: 'Build and Deploy to Expo'

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  EAS_TOKEN: ${{ secrets.EAS_TOKEN }}
  NODE_VERSION: '18'

jobs:
  lint-and-test:
    name: 'Lint and Test'
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4

      - name: 'Setup Node.js'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 'Install dependencies'
        run: npm ci

      - name: 'Run tests'
        run: npm test 2>/dev/null || echo "No tests configured"

  build:
    name: 'Build Expo App'
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4

      - name: 'Setup Node.js'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 'Install dependencies'
        run: npm ci

      - name: 'Install Expo CLI'
        run: npm install -g expo-cli eas-cli

      - name: 'Check Expo project'
        run: expo --version

      - name: 'Verify app config'
        run: npx expo prebuild --help

  build-ios:
    name: 'Build iOS App'
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.EAS_TOKEN != ''

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4

      - name: 'Setup Node.js'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 'Install dependencies'
        run: npm ci

      - name: 'Install EAS CLI'
        run: npm install -g eas-cli

      - name: 'Build iOS App'
        run: eas build --platform ios --non-interactive
        env:
          EAS_TOKEN: ${{ secrets.EAS_TOKEN }}

  build-android:
    name: 'Build Android App'
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.EAS_TOKEN != ''

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4

      - name: 'Setup Node.js'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 'Install dependencies'
        run: npm ci

      - name: 'Install EAS CLI'
        run: npm install -g eas-cli

      - name: 'Build Android App'
        run: eas build --platform android --non-interactive
        env:
          EAS_TOKEN: ${{ secrets.EAS_TOKEN }}

  publish:
    name: 'Publish to Expo'
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.EXPO_TOKEN != ''

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4

      - name: 'Setup Node.js'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 'Install dependencies'
        run: npm ci

      - name: 'Install Expo CLI'
        run: npm install -g expo-cli

      - name: 'Publish to Expo'
        run: expo publish
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: 'Create deployment summary'
        run: |
          echo "## 📱 Expo Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Published to: https://expo.dev/@sulman200101/gke-expo-app" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Details" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "- Timestamp: $(date)" >> $GITHUB_STEP_SUMMARY
